# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: .NET

on:
  push:
    branches:
      - main
      - master
      - '1.4.x'
    tags: '*'
  pull_request:
    branches: '**'
  workflow_dispatch:  # Allow manual triggering

jobs:
  build:
    runs-on: windows-2022

    # Needed to create GitHub Releases for tags (the default token is read-only on new forks).
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x
        cache: true
        cache-dependency-path: '**/packages.lock.json'

    # Cache NuGet packages
    # - name: Cache NuGet packages
    #   uses: actions/cache@v4
    #   with:
    #     path: ~/.nuget/packages
    #     key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}-${{ matrix.targetFramework }}
    #     restore-keys: |
    #       ${{ runner.os }}-nuget-

    - name: Build InfoPanel
      run: |
        dotnet restore --force-evaluate
        dotnet publish InfoPanel/InfoPanel.csproj -c Release -r win-x64 --self-contained -p:PublishProfile=FolderProfile -p:Platform=x64

    - name: Install and Compile Inno Setup Installer
      shell: powershell
      run: |
        cd ${{ github.workspace }}\InnoSetup
        iscc "setup.iss"      

    - name: Upload Artifact Setup
      uses: actions/upload-artifact@v4
      with:
        name: InfoPanel-Setup-${{ github.sha }}
        path: "${{ github.workspace }}/InnoSetup/Output/InfoPanelSetup.exe"
        retention-days: 90

    ###################################
    # Everything below is only for tagged Releases
    ###################################
    # The in-app updater downloads this file and refuses to run an installer whose hash does not match.
    - name: Write Installer Checksum
      if: startsWith(github.ref, 'refs/tags/')
      shell: pwsh
      run: |
        $installer = "${{ github.workspace }}/InnoSetup/Output/InfoPanelSetup.exe"
        $hash = (Get-FileHash -Algorithm SHA256 $installer).Hash.ToLowerInvariant()
        Set-Content -NoNewline -Encoding ascii -Path "$installer.sha256" -Value "$hash  InfoPanelSetup.exe"
        Write-Host "SHA256: $hash"

    # Release notes are generated by GitHub from the pull requests merged since the previous
    # release, and can be edited on the release page afterwards. (The upstream project fetched
    # notes from api.infopanel.net, which this fork has no access to.)
    - name: Upload Release Asset
      if: startsWith(github.ref, 'refs/tags/')
      id: upload-release-asset
      uses: ncipollo/release-action@v1
      with:
        artifacts: "${{ github.workspace }}/InnoSetup/Output/InfoPanelSetup.exe,${{ github.workspace }}/InnoSetup/Output/InfoPanelSetup.exe.sha256"
        generateReleaseNotes: true
        allowUpdates: true
        draft: false
        prerelease: ${{ contains(github.ref, '-') }}